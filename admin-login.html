<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Administrator Keuangan — TerraGIS Enterprise</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      font-family: var(--font-sans);
      color: #e2e8f0;
      padding: 1.5rem;
    }
    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      padding: 2.25rem 2rem;
    }
    .admin-brand-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .admin-brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #0284c7;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .admin-brand-header h3 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .admin-brand-header span {
      font-size: 0.76rem;
      color: #94a3b8;
      display: block;
    }
    .security-notice-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      background: rgba(2, 132, 199, 0.1);
      border: 1px solid rgba(2, 132, 199, 0.25);
      color: #38bdf8;
      font-size: 0.76rem;
      margin-bottom: 1.5rem;
    }
    .admin-field {
      margin-bottom: 1.15rem;
    }
    .admin-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }
    .admin-field input {
      width: 100%;
      padding: 0.75rem 0.95rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      transition: border-color 0.15s ease;
      box-sizing: border-box;
    }
    .admin-field input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    .admin-submit-btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 8px;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s ease, transform 0.12s ease;
      margin-top: 0.5rem;
    }
    .admin-submit-btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .admin-helper-box {
      margin-top: 1.5rem;
      padding-top: 1.15rem;
      border-top: 1px solid #1e293b;
      font-size: 0.76rem;
      color: #64748b;
      text-align: center;
    }
    .admin-helper-box strong {
      color: #94a3b8;
    }
    .back-public-link {
      display: inline-block;
      margin-top: 1.15rem;
      font-size: 0.8rem;
      color: #38bdf8;
      text-decoration: none;
    }
    .back-public-link:hover {
      text-decoration: underline;
    }
    .error-msg {
      margin: 0.5rem 0 0;
      font-size: 0.8rem;
      color: #f87171;
      min-height: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="admin-login-card">
    <div class="admin-brand-header">
      <div class="admin-brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div>
        <h3>TerraGIS Enterprise</h3>
        <span>Konsol Administrasi Finansial &amp; Lisensi</span>
      </div>
    </div>

    <div class="security-notice-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Area Terbatas — Hanya untuk Petugas Verifikasi Keuangan &amp; Akuntansi.</span>
    </div>

    <form id="adminAuthForm">
      <div class="admin-field">
        <label for="adminEmail">Email Resmi Administrator</label>
        <input type="email" id="adminEmail" required value="admin.finance@terragis.id" />
      </div>

      <div class="admin-field">
        <label for="adminPassword">Kata Sandi / Kredensial Keamanan</label>
        <input type="password" id="adminPassword" required value="admin123" />
      </div>

      <p class="error-msg" id="authErrorMsg"></p>

      <button type="submit" class="admin-submit-btn" id="loginSubmitBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Masuk ke Konsol Administrasi</span>
      </button>
    </form>

    <div class="admin-helper-box">
      <span>Kredensial Petugas: <strong>admin.finance@terragis.id</strong> | Sandi: <strong>admin123</strong></span>
      <br />
      <a href="index.html" class="back-public-link">← Kembali ke Halaman Publik</a>
    </div>
  </div>

  <script>
    document.getElementById('adminAuthForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errorMsg = document.getElementById('authErrorMsg');

      if ((email === 'admin.finance@terragis.id' || email === 'admin@terragis.id') && (password === 'admin123' || password === 'admin2026')) {
        const sessionData = {
          name: 'M. Bahrudin',
          role: 'Finance Verification Officer',
          id: 'ADM-FIN-01',
          email: email,
          loginTime: new Date().toISOString()
        };
        sessionStorage.setItem('terragis_admin_session', JSON.stringify(sessionData));
        window.location.href = 'admin.html';
      } else {
        errorMsg.textContent = 'Kombinasi email atau kata sandi administrator tidak valid.';
      }
    });
  </script>
</body>
</html>
